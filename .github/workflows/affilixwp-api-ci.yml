name: AffilixWP API CI

on:
  pull_request:
    paths:
      - 'api-service/**'
      - '.github/workflows/affilixwp-api-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'api-service/**'
      - '.github/workflows/affilixwp-api-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-service/package-lock.json
      - run: npm install
      - run: npm run build
