name: Build AffilixWP Plugin ZIP

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare plugin directory
        run: |
          mkdir -p build/affilixwp
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.gitignore' \
            ./ build/affilixwp/
          test -f build/affilixwp/affilixwp.php

      - name: Create plugin ZIP
        run: |
          cd build
          zip -r affilixwp.zip affilixwp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/affilixwp.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
